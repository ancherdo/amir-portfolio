<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ANON</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Manrope,sans-serif}
body{background:#0d0b09;color:#f3efe6}
header{position:sticky;top:0;background:#0d0b09;border-bottom:1px solid #2a2621;padding:12px 16px;display:flex;gap:12px;align-items:center;z-index:100;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.logo span{color:#d4af37}
.search{flex:1;min-width:150px}
.search input{width:100%;padding:9px 14px;border-radius:999px;border:1px solid #2a2621;background:#16130f;color:#f3efe6}
nav{display:flex;gap:6px}
.navbtn{background:transparent;border:1px solid #2a2621;color:#f3efe6;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:13px}
.navbtn.active{border-color:#d4af37;color:#d4af37}
.cart{background:#d4af37;color:#0d0b09;border:none;padding:9px 16px;border-radius:999px;font-weight:800;cursor:pointer}
.page{display:none}
.page.active{display:block}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#16130f;border:1px solid #2a2621;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.img{height:90px;background:#1e1a14;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.img img{width:100%;height:100%;object-fit:cover}
.title{font-weight:700;font-size:13px}
.price{font-weight:800;font-size:16px}
.add{background:#d4af37;color:#0d0b09;border:none;padding:9px;border-radius:10px;font-weight:800;cursor:pointer}
.add.in{background:transparent;color:#d4af37;border:1px solid #d4af37}
.taxi{height:calc(100dvh - 70px);position:relative}
#tmap{position:absolute;inset:0}
.tbox{position:absolute;top:12px;left:12px;right:12px;background:#16130f;border:1px solid #2a2621;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;max-width:380px;z-index:500}
.tbox h2{font-size:16px}
.tbox label{font-size:11px;opacity:.7}
.tbox input{width:100%;padding:10px;border-radius:10px;border:1px solid #2a2621;background:#0d0b09;color:#f3efe6}
.tr{display:flex;gap:6px}
.tr button{flex:1;padding:8px;border-radius:8px;border:1px solid #2a2621;background:transparent;color:#f3efe6;font-size:12px}
.tr button.active{border-color:#d4af37;color:#d4af37}
.tp{display:flex;justify-content:space-between;font-weight:800}
.tb{background:#d4af37;color:#0d0b09;border:none;padding:11px;border-radius:10px;font-weight:800}
.drawer{position:fixed;right:-100%;top:0;height:100dvh;width:min(380px,100%);background:#16130f;border-left:1px solid #2a2621;transition:.3s;display:flex;flex-direction:column;z-index:999}
.drawer.on{right:0}
.dhead{padding:16px;border-bottom:1px solid #2a2621;display:flex;justify-content:space-between}
.list{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.item{display:flex;gap:10px;align-items:center}
.item img{width:60px;height:60px;border-radius:10px;object-fit:cover}
.info{flex:1}
.qty{display:flex;gap:8px;align-items:center}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid #2a2621;background:none;color:#f3efe6}
.total{padding:16px;border-top:1px solid #2a2621;display:flex;justify-content:space-between;font-weight:800}
.checkout{margin:16px;background:#d4af37;color:#0d0b09;border:none;padding:12px;border-radius:10px;font-weight:800}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:998}
.overlay.on{display:block}
@media(min-width:700px){.tbox{top:20px;left:20px;right:auto}}
</style>
</head>
<body>
<header>
  <div class="logo">ANON <span>SHOP</span></div>
  <div class="search" id="sw"><input id="q" placeholder="Поиск..."></div>
  <nav>
    <button class="navbtn active" data-tab="shop">МАГАЗИН</button>
    <button class="navbtn" data-tab="taxi">ТАКСИ</button>
    <a class="navbtn" href="admin.html">АДМИН</a>
  </nav>
  <button class="cart" id="open">Корзина (<span id="c">0</span>)</button>
</header>
<div class="page active" id="tab-shop">
  <div class="wrap"><div class="grid" id="grid"></div></div>
</div>
<div class="page" id="tab-taxi">
  <div class="taxi">
    <div id="tmap"></div>
    <div class="tbox">
      <h2>АНОН ТАКСИ</h2>
      <div><label>Откуда (нажми на карту)</label><input id="ta" readonly></div>
      <div><label>Куда</label><input id="tb" placeholder="Куда поедем"></div>
      <div style="display:flex;gap:8px">
        <div style="flex:1"><label>Имя</label><input id="tname"></div>
        <div style="flex:1"><label>Телефон</label><input id="tphone" placeholder="+998"></div>
      </div>
      <div class="tr">
        <button class="active" data-t="Эконом">Эконом</button>
        <button data-t="Комфорт">Комфорт</button>
        <button data-t="Бизнес">Бизнес</button>
      </div>
      <div class="tp"><span>Цена</span><span id="tp">0 сум</span></div>
      <button class="tb" id="tcall" disabled>Вызвать</button>
    </div>
  </div>
</div>
<div class="overlay" id="ov"></div>
<div class="drawer" id="dr">
  <div class="dhead"><b>Корзина</b><button id="close" style="background:none;border:none;color:#f3efe6">✕</button></div>
  <div class="list" id="list"></div>
  <div class="total"><span>Итого</span><span id="sum">0 сум</span></div>
  <button class="checkout" id="order">Оформить в Telegram</button>
</div>
<script>
const TG="intellect_anon";
let cart={};try{cart=JSON.parse(localStorage.getItem('cart')||'{}')}catch(e){}
const fmt=n=>n.toLocaleString('ru-RU');
function img(n){return 'img/'+encodeURIComponent(n)+'.png';}
async function load(){try{const r=await fetch('products.json',{cache:'no-store'});window.P=await r.json();}catch(e){window.P=[["Чипсы Pringles",16000,"snack","🥔"],["Чипсы Lay's 60 г",17000,"snack","🥔"],["Жвачка Dirol (5 шт)",4000,"snack","🫧"],["Чай Lipton зелёный 0,5 л",8990,"drink","🍵"],["Coca-Cola 0,5 л",8999,"drink","🥤"],["Pepsi 0,5 л",8490,"drink","🥤"],["Fanta 0,5 л",8990,"drink","🍊"],["Sprite 0,5 л",8990,"drink","🥤"],["Fuse Tea 0,5 л",8990,"drink","🧃"],["Марс",13000,"snack","🍫"],["Сникерс",13000,"snack","🍫"],["Баунти",13000,"snack","🍫"],["Твикс",13000,"snack","🍫"],["Орео",24000,"snack","🍪"]];}render();}
function render(){const P=window.P||[];const q=document.getElementById('q').value.toLowerCase();document.getElementById('grid').innerHTML=P.map((p,i)=>{if(q&&!p[0].toLowerCase().includes(q))return'';const inCart=cart[i]>0;return `<div class="card"><div class="img"><img src="${img(p[0])}" onerror="this.remove()"></div><div class="title">${p[0]}</div><div class="price">${fmt(p[1])} сум</div><button class="add ${inCart?'in':''}" data-add="${i}">${inCart?'В корзине':'В корзину'}</button></div>`;}).join('');update();}
function update(){const P=window.P||[];let c=0,s=0;for(let k in cart){if(P[k]){c+=cart[k];s+=P[k][1]*cart[k]}}document.getElementById('c').textContent=c;document.getElementById('sum').textContent=fmt(s)+' сум';document.getElementById('list').innerHTML=Object.keys(cart).filter(k=>cart[k]>0&&P[k]).map(k=>{const p=P[k],n=cart[k];return `<div class="item"><img src="${img(p[0])}" onerror="this.remove()"><div class="info"><div>${p[0]}</div><div>${fmt(p[1])} сум</div></div><div class="qty"><button data-dec="${k}">-</button><span>${n}</span><button data-inc="${k}">+</button></div></div>`;}).join('')||'Корзина пуста';}
document.querySelectorAll('.navbtn[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.navbtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById('tab-'+b.dataset.tab).classList.add('active');document.getElementById('sw').style.display=b.dataset.tab==='shop'?'block':'none';document.getElementById('open').style.display=b.dataset.tab==='shop'?'block':'none';if(b.dataset.tab==='taxi'&&!window._tm)loadT();});
document.getElementById('grid').addEventListener('click',e=>{const P=window.P||[];const b=e.target.closest('[data-add]');if(!b)return;const i=+b.dataset.add;if(cart[i]){open();return;}cart[i]=1;localStorage.setItem('cart',JSON.stringify(cart));render();open();});
document.getElementById('list').addEventListener('click',e=>{const P=window.P||[];const inc=e.target.closest('[data-inc]'),dec=e.target.closest('[data-dec]');if(inc){const i=+inc.dataset.inc;if(P[i]){cart[i]++;localStorage.setItem('cart',JSON.stringify(cart));render();}return;}if(dec){const i=+dec.dataset.dec;if(P[i]){cart[i]--;if(cart[i]<=0)delete cart[i];localStorage.setItem('cart',JSON.stringify(cart));render();}return;}});
document.getElementById('q').addEventListener('input',render);
const open=()=>{document.getElementById('dr').classList.add('on');document.getElementById('ov').classList.add('on')};
document.getElementById('open').onclick=open;
document.getElementById('close').onclick=()=>{document.getElementById('dr').classList.remove('on');document.getElementById('ov').classList.remove('on')};
document.getElementById('ov').onclick=document.getElementById('close').onclick;
document.getElementById('order').onclick=()=>{const P=window.P||[];let text='Заказ ANON SHOP%0A';let total=0;for(let k in cart){if(cart[k]>0&&P[k]){text+=encodeURIComponent(P[k][0]+' x'+cart[k]+' = '+P[k][1]*cart[k]+' сум')+'%0A';total+=P[k][1]*cart[k];}}text+=encodeURIComponent('Итого: '+total+' сум');window.open('https://t.me/'+TG+'?text='+text,'_blank');};
let ta=null,tb=null,ma=null,mb=null,tr='Эконом';
document.querySelectorAll('.tr button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tr button').forEach(x=>x.classList.remove('active'));b.classList.add('active');tr=b.dataset.t;calc();});
function calc(){if(!ta||!tb)return;const d=ta.distanceTo(tb)/1000;let k=tr==='Эконом'?4000:tr==='Комфорт'?5500:8500;const p=Math.round(d*k/1000)*1000||5000;document.getElementById('tp').textContent=fmt(p)+' сум';document.getElementById('tp').dataset.v=p;document.getElementById('tcall').disabled=false;}
function loadT(){window._tm=L.map('tmap',{zoomControl:false}).setView([41.311081,69.240562],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(window._tm);setTimeout(()=>window._tm.invalidateSize(),200);window._tm.on('click',e=>{if(!ta){ta=e.latlng;ma=L.marker(e.latlng).addTo(window._tm);document.getElementById('ta').value=e.latlng.lat.toFixed(5)+','+e.latlng.lng.toFixed(5);}else if(!tb){tb=e.latlng;mb=L.marker(e.latlng).addTo(window._tm);document.getElementById('tb').value=e.latlng.lat.toFixed(5)+','+e.latlng.lng.toFixed(5);calc();}});}
document.getElementById('tcall').onclick=()=>{const n=document.getElementById('tname').value.trim(),ph=document.getElementById('tphone').value.trim();if(!n||!ph||!tb)return alert('Укажи откуда, куда, имя, телефон');const text='АНОН ТАКСИ%0AТариф: '+encodeURIComponent(tr)+'%0AОткуда: '+encodeURIComponent(document.getElementById('ta').value)+'%0AКуда: '+encodeURIComponent(document.getElementById('tb').value)+'%0AИмя: '+encodeURIComponent(n)+'%0AТелефон: '+encodeURIComponent(ph)+'%0AЦена: '+(document.getElementById('tp').dataset.v||0)+' сум';window.open('https://t.me/'+TG+'?text='+text,'_blank');};
load();
</script>
</body>
</html>
